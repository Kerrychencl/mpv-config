# ===========================================================================
# MPV 全功能快捷鍵與階層式右鍵選單設定檔 (input.conf)
# 支援繁體中文動態右鍵選單 (scripts/menu) 與多媒體增強擴充
# ===========================================================================

# ----------------------------------------------------
# 1. 開啟 (Open)
# ----------------------------------------------------
Ctrl+o        script-binding file_browser/browse-files #menu: 開啟 > 檔案瀏覽器...
Ctrl+O        script-message-to menu open-folder       #menu: 開啟 > 開啟資料夾...
_             script-message-to dialog open append     #menu: 開啟 > 新增至播放清單...
_             ignore                                   #menu: 開啟 > -
Ctrl+v        script-binding SmartCopyPaste/paste      #menu: 開啟 > 貼上並播放剪貼簿 (URL/檔案)
Ctrl+V        script-binding SmartCopyPaste/paste
p             script-binding SmartCopyPaste/paste
P             script-binding SmartCopyPaste/paste
MBTN_MID      script-binding SmartCopyPaste/paste
Ctrl+Shift+v  script-binding SmartCopyPaste/paste-specific

# ----------------------------------------------------
# 2. 播放與回放 (Playback)
# ----------------------------------------------------
Space         cycle pause                              #menu: 播放 > 播放 / 暫停 #@state=(idle_active and 'disabled' or (pause and 'checked'))
Ctrl+s        stop                                     #menu: 播放 > 停止 #@state=(idle_active and 'disabled')
_             ignore                                   #menu: 播放 > -
l             ab-loop                                  #menu: 播放 > 設定 / 清除 A-B 循環點
L             cycle-values loop-file inf no            #menu: 播放 > 切換單檔循環播放 #@state=(loop_file == 'inf' and 'checked')
_             ignore                                   #menu: 播放 > -
Alt+u         script-binding sponsorblock/sponsorblock-undo #menu: 播放 > 復原 SponsorBlock 跳過
Alt+t         script-binding btr/toggle_menu           #menu: 播放 > 執行緒撕裂者 (BTR 串流加速)

# ----------------------------------------------------
# 3. 導覽與進度 (Navigation)
# ----------------------------------------------------
_             ignore                                   #menu: 導覽 > 章節列表 #@chapters
_             ignore                                   #menu: 導覽 > 播放清單 #@playlist
F12           playlist-next                            #menu: 導覽 > 下一個檔案
F11           playlist-prev                            #menu: 導覽 > 上一個檔案
_             ignore                                   #menu: 導覽 > -
PGUP          add chapter  1                           #menu: 導覽 > 下一章節
PGDWN         add chapter -1                           #menu: 導覽 > 上一章節
_             ignore                                   #menu: 導覽 > -
Right         seek  5 exact                            #menu: 導覽 > 前進 5 秒 (精確)
Left          seek -5 exact                            #menu: 導覽 > 後退 5 秒 (精確)
Up            seek  30                                 #menu: 導覽 > 前進 30 秒
Down          seek -30                                 #menu: 導覽 > 後退 30 秒
.             frame-step                               #menu: 導覽 > 下一畫面格
,             frame-back-step                          #menu: 導覽 > 上一畫面格

# ----------------------------------------------------
# 4. 軌道與串流畫質 (Tracks & Quality)
# ----------------------------------------------------
Ctrl+f        script-binding quality_menu/video_formats_toggle #menu: 畫質 > 串流視訊解析度選單
Alt+f         script-binding quality_menu/audio_formats_toggle #menu: 畫質 > 串流音訊音軌選單
F             script-binding quality_menu/video_formats_toggle
_             ignore                                   #menu: 畫質 > 版本列表 #@editions

# ----------------------------------------------------
# 5. 視訊控制 (Video)
# ----------------------------------------------------
Alt+s         script-binding modernz/speed_menu/toggle #menu: 視訊 > 倍速播放選單
]             script-binding modernz/speed_menu/step_up   #menu: 視訊 > 倍速 > 微調 +0.05
[             script-binding modernz/speed_menu/step_down #menu: 視訊 > 倍速 > 微調 -0.05
}             add speed  0.25                          #menu: 視訊 > 倍速 > 快進 +0.25
{             add speed -0.25                          #menu: 視訊 > 倍速 > 慢退 -0.25
BS            script-binding modernz/speed_menu/reset  #menu: 視訊 > 倍速 > 重設為 1.00x
_             ignore                                   #menu: 視訊 > -
KP8           cycle video                              #menu: 視訊 > 切換視訊軌 #@tracks/video
_             set hwdec "auto-safe"                    #menu: 視訊 > 硬體解碼 > 自動最佳硬解 (auto-safe) #@state=(hwdec_current and hwdec_current ~= "no" and 'checked')
_             set hwdec "nvdec"                        #menu: 視訊 > 硬體解碼 > NVIDIA 硬解 (nvdec)
_             set hwdec "d3d11va"                      #menu: 視訊 > 硬體解碼 > Direct3D 11 硬解 (d3d11va)
_             set hwdec "no"                           #menu: 視訊 > 硬體解碼 > 軟體解碼 (CPU 解碼) #@state=(hwdec_current == "no" and 'checked')
_             ignore                                   #menu: 視訊 > -
Ctrl+r        cycle-values video-rotate 90 180 270 0   #menu: 視訊 > 旋轉 90 度
a             cycle-values video-aspect-override 16:9 4:3 2.35:1 -1 #menu: 視訊 > 長寬比切換
_             set video-aspect-override 16:9           #menu: 視訊 > 長寬比 > 16:9
_             set video-aspect-override 4:3            #menu: 視訊 > 長寬比 > 4:3
_             set video-aspect-override 2.35:1         #menu: 視訊 > 長寬比 > 2.35:1
_             set video-aspect-override -1             #menu: 視訊 > 長寬比 > 自動預設

# ----------------------------------------------------
# 6. 視訊增強與著色器 (Video Enhancement / Shaders)
# ----------------------------------------------------
Ctrl+0        no-osd change-list glsl-shaders clr ""; show-text "著色器已全部關閉" #menu: 視訊增強 > 關閉所有著色器
Alt+c         no-osd change-list glsl-shaders clr ""; show-text "著色器已全部關閉"
_             ignore                                   #menu: 視訊增強 > -

