# ----------------------------------------------------
# 7. 音訊控制 (Audio)
# ----------------------------------------------------
KP7           cycle audio                              #menu: 音訊 > 切換音訊軌 #@tracks/audio
_             ignore                                   #menu: 音訊 > 音訊輸出裝置 #@audio-devices
_             ignore                                   #menu: 音訊 > -
m             cycle mute                               #menu: 音訊 > 靜音開關 #@state=(mute and 'checked')
WHEEL_UP      add volume  2                            #menu: 音訊 > 音量 +2%
WHEEL_DOWN    add volume -2                            #menu: 音訊 > 音量 -2%
Ctrl+d        add audio-delay  0.1                     #menu: 音訊 > 延遲 +0.1 秒
Ctrl+D        add audio-delay -0.1                     #menu: 音訊 > 延遲 -0.1 秒

# ----------------------------------------------------
# 8. 字幕控制 (Subtitles)
# ----------------------------------------------------
c             cycle sub-visibility                     #menu: 字幕 > 顯示 / 隱藏字幕 #@state=(sub_visibility and 'checked')
v             cycle sub-visibility
C             set sub no ; show-text "字幕已關閉"     #menu: 字幕 > 關閉所有字幕
V             set sub no ; show-text "字幕已關閉"
j             cycle sub                                #menu: 字幕 > 切換下一個字幕軌
J             cycle sub down                           #menu: 字幕 > 切換上一個字幕軌
Alt+c         script-binding select/select-sid         #menu: 字幕 > 呼出字幕軌選擇清單 #@tracks/sub
_             ignore                                   #menu: 字幕 > -
z             add sub-delay -0.1                       #menu: 字幕 > 字幕延遲 -0.1 秒
Z             add sub-delay  0.1                       #menu: 字幕 > 字幕延遲 +0.1 秒
r             add sub-pos -1                           #menu: 字幕 > 字幕位置上移
R             add sub-pos +1                           #menu: 字幕 > 字幕位置下移
F             add sub-scale -0.1                       #menu: 字幕 > 縮小字幕字體
G             add sub-scale  0.1                       #menu: 字幕 > 放大字幕字體

# ----------------------------------------------------
# 9. 彈幕控制 (Danmaku)
# ----------------------------------------------------
b             script-binding danmaku_menu/toggle_danmaku   #menu: 彈幕 > 一鍵顯示 / 隱藏彈幕
d             script-binding danmaku_menu/toggle_menu      #menu: 彈幕 > 彈幕控制與設置面板
Alt+b         script-binding danmaku_menu/toggle_menu
Alt+y         script-binding b2y_menu/b2y-toggle-menu      #menu: 彈幕 > B2Y 彈幕匹配管理面板
Ctrl+b        script-binding b2y_menu/b2y-toggle-menu
_             ignore                                       #menu: 彈幕 > -
Alt+d         script-binding mpv_danmaku/load-external-danmaku #menu: 彈幕 > 掛載外部彈幕 (XML/ASS)
Alt+o         script-binding mpv_danmaku/pick-external-danmaku #menu: 彈幕 > 瀏覽並選取任意彈幕檔案
Alt+l         script-binding mpv_danmaku/cycle-sibling-danmaku #menu: 彈幕 > 輪播同目錄彈幕檔案
B             script-binding mpv_danmaku/reload-danmaku    #menu: 彈幕 > 手動重新載入彈幕
_             ignore                                       #menu: 彈幕 > -
Ctrl+[        add secondary-sub-delay -0.5 ; show-text "彈幕延遲: ${secondary-sub-delay}s" #menu: 彈幕 > 彈幕延遲 -0.5 秒
Ctrl+]        add secondary-sub-delay  0.5 ; show-text "彈幕延遲: ${secondary-sub-delay}s" #menu: 彈幕 > 彈幕延遲 +0.5 秒
Ctrl+BS       set secondary-sub-delay 0   ; show-text "彈幕延遲已重設"                      #menu: 彈幕 > 重設彈幕延遲

# ----------------------------------------------------
# 10. 工具與系統 (Tools)
# ----------------------------------------------------
Ctrl+c        script-binding SmartCopyPaste/copy           #menu: 工具 > 複製播放進度與網址到剪貼簿
Ctrl+C        script-binding SmartCopyPaste/copy
_             script-message-to dialog set-clipboard ${path} #menu: 工具 > 複製檔案完整路徑
i             script-binding stats/display-stats-toggle    #menu: 工具 > 媒體詳細統計面板 (OSD Stats)
`             script-binding console/enable                #menu: 工具 > 開啟 MPV 終端控制台
_             script-message sync-browser-cookies          #menu: 工具 > 從瀏覽器同步最新 Cookies (Firefox)
_             playlist-shuffle                             #menu: 工具 > 打亂目前播放清單

# ----------------------------------------------------
# 11. 視窗控制 (Window)
# ----------------------------------------------------
f             cycle fullscreen                             #menu: 視窗 > 切換全螢幕 #@state=(fullscreen and 'checked')
F11           cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
Alt+Enter     cycle fullscreen
Alt+0         cycle window-maximized                       #menu: 視窗 > 切換視窗最大化 #@state=(window_maximized and 'checked')
Ctrl+t        cycle ontop                                  #menu: 視窗 > 視窗最上層置頂 #@state=(ontop and 'checked')
_             ignore                                       #menu: 視窗 > -
Alt+=         add window-scale  0.1                        #menu: 視窗 > 視窗放大 10%
Alt+-         add window-scale -0.1                        #menu: 視窗 > 視窗縮小 10%
Ctrl+=        add window-scale  0.1
Ctrl+-        add window-scale -0.1
Alt+1         set window-scale 0.5                         #menu: 視窗 > 縮放至 50%
Alt+2         set window-scale 1.0                         #menu: 視窗 > 縮放至 100% (原始大小)
Alt+3         set window-scale 1.5                         #menu: 視窗 > 縮放至 150%

# ----------------------------------------------------
# 12. 結束 (Quit)
# ----------------------------------------------------
Q             quit-watch-later                             #menu: 結束 > 記住進度退出 (稍後觀看)
q             quit                                         #menu: 結束 > 關閉 MPV 播放器

# ----------------------------------------------------
# 13. 右鍵與選單呼叫按鍵綁定 (Cascading Context Menu)
# ----------------------------------------------------
MBTN_RIGHT    script-message-to menu show
MENU          script-message-to menu show
