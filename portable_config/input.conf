# ==========================================
# MPV 自訂快捷鍵 (input.conf)
# ==========================================

# 方向左右鍵：精確快轉 / 倒退 5 秒
RIGHT seek  5 exact
LEFT  seek -5 exact

# ------------------------------------------
# 播放倍速控制 (YouTube 風格 0.05 細微調整)
# ------------------------------------------
# ] / [: 倍速 ±0.05 精細微調
]  script-binding speed_menu/step_up
[  script-binding speed_menu/step_down
# } / {: 倍速 ±0.25 快速調整
}  add speed  0.25
{  add speed -0.25
# Backspace (倒退鍵): 瞬間恢復 1.00x 原速
BS script-binding speed_menu/reset
# Alt+s: 彈出 YouTube 風格視覺化倍速選單
Alt+s script-binding speed_menu/toggle

# ------------------------------------------
# 網路串流 (YouTube / B站) 貼上與播放快捷鍵
# ------------------------------------------
# 支援 Ctrl+v / 單鍵 p / 滑鼠滾輪中鍵點擊：立即貼上並播放
Ctrl+v       script-binding SmartCopyPaste/paste
Ctrl+V       script-binding SmartCopyPaste/paste
p            script-binding SmartCopyPaste/paste
P            script-binding SmartCopyPaste/paste
MBTN_MID     script-binding SmartCopyPaste/paste
Ctrl+Shift+v script-binding SmartCopyPaste/paste-specific

# Ctrl+c: 複製目前播放時間與網址到剪貼簿
Ctrl+c       script-binding SmartCopyPaste/copy
Ctrl+C       script-binding SmartCopyPaste/copy

# Ctrl+f: 彈出串流影片解析度（畫質）選擇選單
Ctrl+f script-binding quality_menu/video_formats_toggle
Alt+f  script-binding quality_menu/audio_formats_toggle

# 字幕與彈幕控制 (支援 YouTube CC 標準快捷鍵與 Bilibili 彈幕面板，雙軌獨立並存互不干擾)
c osd-msg cycle sub-visibility                             # c: 開關外掛 CC 字幕 (不影響彈幕)
C set sub no ; show-text "字幕已關閉"                      # Shift+c: 徹底關閉/取消選取外掛字幕
v osd-msg cycle sub-visibility                             # v: 開關外掛 CC 字幕
V set sub no ; show-text "字幕已關閉"                      # Shift+v: 徹底關閉/取消選取外掛字幕
j cycle sub                                                # j: 切換下一個外掛字幕軌 (繁中/簡中/英文等)
J cycle sub down                                           # Shift+j: 切換上一個外掛字幕軌
Alt+c script-binding select/select-sid                     # Alt+c: 呼出字幕軌選擇清單 (直接用滑鼠或方向鍵選)

b script-binding danmaku_menu/toggle_danmaku               # b: 一鍵快速開關彈幕 (不影響 CC 字幕)
d script-binding danmaku_menu/toggle_menu                  # d: 彈出 B 站風格彈幕控制與高級設置面板
Alt+b script-binding danmaku_menu/toggle_menu              # Alt+b: 彈出彈幕控制面板
Alt+d script-binding mpv_danmaku/load-external-danmaku      # Alt+d: 掛載外部彈幕 (XML/ASS/剪貼簿)
Alt+o script-binding mpv_danmaku/pick-external-danmaku      # Alt+o: 開啟檔案瀏覽器選取外部彈幕/字幕 (支援任意檔名與路徑)
Alt+l script-binding mpv_danmaku/cycle-sibling-danmaku      # Alt+l: 快速輪播切換同目錄下的其他彈幕檔案

Alt+y script-binding b2y_menu/b2y-toggle-menu              # Alt+y: 彈出 B2Y 視覺化彈幕匹配與管理面板
Ctrl+b script-binding b2y_menu/b2y-toggle-menu             # Ctrl+b: 彈出 B2Y 視覺化彈幕匹配與管理面板
B script-binding mpv_danmaku/reload-danmaku                # Shift+b: 手動重新載入彈幕
Alt+u script-binding sponsorblock/sponsorblock-undo        # Alt+u: 復原 SponsorBlock 上次跳過的廣告片段
Alt+t script-binding btr/toggle_menu                      # Alt+t: 彈出 Bilibili 執行緒撕裂者 (BTR 串流加速) 設定面板

# 彈幕時間軸校準 (依需求微調彈幕與影片同步)
Ctrl+[ add secondary-sub-delay -0.5 ; show-text "彈幕延遲: ${secondary-sub-delay}s"
Ctrl+] add secondary-sub-delay  0.5 ; show-text "彈幕延遲: ${secondary-sub-delay}s"
Ctrl+BS set secondary-sub-delay 0   ; show-text "彈幕延遲已重置"

# ----------------------------------------------------
# 視窗放大 / 縮小 / 全螢幕控制（滿足開檔固定尺寸、隨時自由放大的需求）
# ----------------------------------------------------
f             cycle fullscreen                         # f: 切換全螢幕
F11           cycle fullscreen                         # F11: 切換全螢幕
MBTN_LEFT_DBL cycle fullscreen                         # 左鍵連點兩下: 切換全螢幕
Alt+Enter     cycle fullscreen                         # Alt+Enter: 切換全螢幕
Alt+0         cycle window-maximized                   # Alt+0: 切換視窗最大化（保留 Windows 工作列）
Alt+=         add window-scale  0.1                    # Alt+= (Alt++): 視窗等比放大 10%
Alt+-         add window-scale -0.1                    # Alt+-: 視窗等比縮小 10%
Ctrl+=        add window-scale  0.1                    # Ctrl+= (Ctrl++): 視窗等比放大 10%
Ctrl+-        add window-scale -0.1                    # Ctrl+-: 視窗等比縮小 10%
Alt+1         set window-scale 0.5                     # Alt+1: 50% 縮放
Alt+2         set window-scale 1.0                     # Alt+2: 100% 原始大小
Alt+3         set window-scale 1.5                     # Alt+3: 150% 放大

# ----------------------------------------------------
# 滑鼠右鍵選單 (Context Menu 繁體中文)
# ----------------------------------------------------
MBTN_RIGHT    context-menu                             # 滑鼠右鍵: 彈出繁體中文功能選單
MENU          context-menu                             # 鍵盤選單鍵 (AppsKey): 彈出功能選單



# ----------------------------------------------------
# 資料夾與檔案瀏覽器 (mpv-file-browser)
# ----------------------------------------------------
Ctrl+o        script-binding file_browser/browse-files # Ctrl+o: 開啟/關閉螢幕內本機檔案瀏覽器

# ----------------------------------------------------
# 串流畫質選單 (quality-menu)
# ----------------------------------------------------
F             script-binding quality_menu/video_formats_toggle # F: 彈出串流視訊解析度選單

# ----------------------------------------------------
# 二次元 / 動漫放大修復著色器 (Anime4K v4.0.1)
# ----------------------------------------------------
Ctrl+1        no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: 模式 A (平衡修復放大 / 推薦一般動漫)"
Ctrl+2        no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: 模式 B (柔和去模糊 / 推薦老番與720p)"
Ctrl+3        no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: 模式 C (高清去噪細化 / 推薦1080p高清源)"
Ctrl+4        no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: 模式 A+A (極致超解析度修復)"
Ctrl+0        no-osd change-list glsl-shaders clr ""; show-text "Anime4K: 已關閉所有著色器"
