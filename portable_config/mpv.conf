# 原skin關閉
osc = no
# 停用 MPV 內建英文統計疊層，由 scripts/stats.lua 全面接管以實現繁體中文化
load-stats-overlay = no

# 視窗閒置與結束行為（保證未開檔案或影片播完時視窗不關閉，隨時可按 Ctrl+v 貼上播放）
idle = yes
keep-open = yes

# 播放進度記憶功能
save-position-on-quit = yes
watch-later-options-remove = speed
watch-later-options-remove = sub-pos
watch-later-options-remove = sub-visibility
watch-later-options-remove = secondary-sub-visibility
watch-later-options-remove = vf
reset-on-next-file-append = speed

# 次字幕（彈幕軌道）特效保護：禁止去除 ASS 特效樣式，確保彈幕位置、移動與描邊正常呈現
secondary-sub-ass-override = no

# 窗口介面無邊框化
no-border

# ----------------------------------------------------
# 預設視窗尺寸與居中（固定適中大小，開檔不再過大佔滿螢幕）
# ----------------------------------------------------
# 初始開啟影片時，自動適配為螢幕的 60%x60%（保持影片長寬比，留有周圍視野）
# 若您想調大或調小，可隨時微調此處百分比（如 65%x65% 或 55%x55%）
autofit = 80%x80%
# 視窗初始居中顯示於螢幕中央
geometry = 50%:50%
# 視窗拖曳至螢幕邊緣時自動吸附
snap-window = yes

# 使用硬件解碼 (即用GPU)
hwdec = auto

# 現代視訊著色輸出與液態玻璃 (ModernGlass) 背景毛玻璃模糊渲染管線
vo = gpu-next
video-sync = display-resample

# 高精度跳轉（確保每次快轉/倒退精確為 5 秒，不因關鍵影格而有秒數誤差）
hr-seek = yes
hr-seek-framedrop = yes

# 串流與快取優化 (提升 YouTube / B站 載入流暢度)
script-opts-append = ytdl_hook-ytdl_path=~~/../yt-dlp.exe
script-opts-append = ytdl_hook-try_ytdl_first=yes
# 網路串流與防盜鏈緩衝優化 (防範 External Player 直鏈串流中途斷流卡死)
user-agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
demuxer-lavf-o = reconnect=1,reconnect_streamed=1,reconnect_delay_max=5
demuxer-max-bytes = 500M
demuxer-max-back-bytes = 150M
demuxer-readahead-secs = 30
ytdl-format = bestvideo+bestaudio/best

# 自動拉取 YouTube CC 外掛字幕與自動生成字幕
sub-auto = fuzzy
slang = zh-Hant,zh-TW,cht,zh-Hans,zh-CN,chi,zh,en,ja
ytdl-raw-options-append = sub-langs=zh-Hant,zh-TW,zh-Hans,zh,en
ytdl-raw-options-append = write-subs=
ytdl-raw-options-append = write-auto-subs=

# ----------------------------------------------------
# 自訂 Cookies 設定檔（由您親自填入 Cookies）
# ----------------------------------------------------
# 已為您綁定專屬 Cookies 檔案，請直接開啟同目錄下的 cookies.txt 貼入內容即可：
cookies-file = "~~/cookies.txt"

# 字幕預設樣式(美觀)：【sub-font(字型) 】【sub-font-size(字型大小)】【sub-color(字幕顏色)】【sub-border-color(字幕邊框顏色)】【sub-border-size(字幕邊框大小)】
sub-font = "Microsoft YaHei"
sub-font-size = 45
sub-color = "#fbc420"
sub-border-color = "#000000"
sub-border-size = 2.5


# ==============================================================================
# 畫質自動設定檔（Auto-Profiles）
# 根據片源規格（4K HDR、動漫、老舊/低解析度、高幀率）自動啟用最佳渲染管線
# ==============================================================================

# ----------------------------------------------------
# 1. 4K 超高解析度影片（寬度 >= 3840 或 高度 >= 2160）
# 4K 原生像素密集，關閉耗能的重度 Deband，採用輕量高品質演算法保證 0 掉幀
# ----------------------------------------------------
[4k-video]
profile-desc = "4K 超高解析度優化"
profile-cond = (width >= 3840 or height >= 2160) and not p["current-tracks/video/image"]
profile-restore = copy
deband = no
scale = spline36
cscale = spline36
dscale = mitchell

# ----------------------------------------------------
# 2. HDR 廣色域高動態範圍影片（PQ / HLG / BT.2020）
# 自動啟用色彩管理、色調映射與動態亮度計算
# ----------------------------------------------------
[hdr-video]
profile-desc = "HDR 廣色域高動態範圍"
profile-cond = (p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg" or p["video-params/colormatrix"] == "bt.2020-ncl")
profile-restore = copy
target-colorspace-hint = yes
tone-mapping = auto
hdr-compute-peak = yes

# ----------------------------------------------------
# 3. 二次元 / 動漫影片自動優化（路徑或標題包含動漫/番劇特徵）
# 自動開啟去色帶濾鏡（消除暗部色階斷層）並設定平滑色階
# ----------------------------------------------------
[anime-video]
profile-desc = "二次元 / 動漫自動色帶修復"
profile-cond = (path and (string.find(path:lower(), "anime") or string.find(path:lower(), "%[.-%]") or string.find(path:lower(), "bilibili"))) or (p["media-title"] and (string.find(p["media-title"]:lower(), "anime") or string.find(p["media-title"]:lower(), "bilibili")))
profile-restore = copy
deband = yes
deband-iterations = 2
deband-threshold = 48
deband-range = 16
deband-grain = 32

# ----------------------------------------------------
# 4. 老舊影片 / 低解析度影片（高度 < 720 且 寬度 < 1280）
# 啟用精細縮放演算法（EWA-Lanczos），提升邊緣清晰度
# ----------------------------------------------------
[low-res-video]
profile-desc = "老舊 / 低解析度影片放大清晰化"
profile-cond = (height < 720 and width < 1280 and width > 0) and not p["current-tracks/video/image"]
profile-restore = copy
deband = yes
scale = ewa_lanczos
cscale = ewa_lanczos
dscale = mitchell
correct-downscaling = yes
linear-downscaling = yes

# ----------------------------------------------------
# 5. 高影格率影片（60fps 及以上）
# 減輕負載確保畫面順暢、音畫同步
# ----------------------------------------------------
[high-fps-video]
profile-desc = "高影格率流暢優化"
profile-cond = (p["container-fps"] >= 59 or p["estimated-vf-fps"] >= 59)
profile-restore = copy
video-sync = display-resample

# ----------------------------------------------------
# 6. B站線上串流專用防盜鏈 Referer
# ----------------------------------------------------
[bilibili-stream]
profile-desc = "Bilibili 串流防盜鏈 Referer"
profile-cond = (path and (string.find(path:lower(), "bilibili%.com") or string.find(path:lower(), "bilivideo%.com"))) or (p["stream-open-filename"] and (string.find(p["stream-open-filename"]:lower(), "bilibili%.com") or string.find(p["stream-open-filename"]:lower(), "bilivideo%.com")))
profile-restore = copy
referrer = "https://www.bilibili.com"

