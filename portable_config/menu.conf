軌道清單(&T)	$tracks
播放控制(&L)
	圖片顯示時長(&D)	hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
		1 秒			set image-display-duration 1		checked=image_display_duration == 1
		2 秒			set image-display-duration 2		checked=image_display_duration == 2
		5 秒			set image-display-duration 5		checked=image_display_duration == 5
		10 秒			set image-display-duration 10		checked=image_display_duration == 10
		無限			set image-display-duration inf		checked=image_display_duration == math.huge
	播放倍速(&E)
		0.25x			set speed 0.25		checked=speed == 0.25
		0.50x			set speed 0.50		checked=speed == 0.50
		0.75x			set speed 0.75		checked=speed == 0.75
		1.00x (原速)(&1)	set speed 1			checked=speed == 1
		1.25x(&2)		set speed 1.25		checked=speed == 1.25
		1.50x(&5)		set speed 1.50		checked=speed == 1.50
		1.75x(&7)		set speed 1.75		checked=speed == 1.75
		2.00x(&2)		set speed 2			checked=speed == 2
		4.00x(&4)		set speed 4			checked=speed == 4
		8.00x(&8)		set speed 8			checked=speed == 8

	設定/清除 A-B 循環點(&A)	ab-loop
	單檔循環播放(&L)		cycle-values loop-file inf no		checked=loop_file == "inf"
	清單循環播放(&O)		cycle-values loop-playlist inf no	checked=loop_playlist == "inf"

	快轉 10 秒(&1)		seek  10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	倒退 10 秒(&0)		seek -10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	快轉 10 分鐘(&M)		seek  600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	倒退 10 分鐘(&I)		seek -600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]

	重新載入目前檔案(&R)	set file-local-options/start ${=time-pos}; playlist-play-index current yes; show-text "正在重新載入目前檔案..."

	下一個檔案(&N)		playlist-next	disabled=playlist_count < 2
	上一個檔案(&P)		playlist-prev	disabled=playlist_count < 2

	下一個子播放清單(&E)	playlist-next-playlist	disabled=playlist_count < 2
	上一個子播放清單(&R)	playlist-prev-playlist	disabled=playlist_count < 2

	隨機播放(&S)		playlist-shuffle
	取消隨機播放(&U)		playlist-unshuffle
