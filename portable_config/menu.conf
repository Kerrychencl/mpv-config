	原始解析度 (不縮放)(&U)	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0	checked=video_unscaled
	畫面縮放(&Z)
		50%(&5)		set video-zoom -1	checked=video_zoom == -1
		100% (原始大小)(&1)	set video-zoom  0	checked=video_zoom == 0
		200%(&2)	set video-zoom  1	checked=video_zoom == 1
	長寬比例(&A)
		16:9(&1)		set video-aspect-override 16:9		checked=math.abs(video_aspect_override - 16/9) < 1e-12
		4:3(&4)			set video-aspect-override 4:3		checked=math.abs(video_aspect_override - 4/3) < 1e-12
		2.35:1(&2)		set video-aspect-override 2.35:1	checked=video_aspect_override == 2.35
		預設比例(&D)		set video-aspect-override no		checked=video_aspect_override == -2
	畫面居中重置(&C)		no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0		disabled=video_pan_x == 0 and video_pan_y == 0 and video_align_x == 0 and video_align_y == 0

	順時針旋轉 90°(&R)	cycle-values video-rotate 90 180 270 0
